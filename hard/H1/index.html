<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 1 - Mini ATM</title>
</head>
<body>

  <h2>Soal 1: Mini Mesin ATM</h2>

  <input type="number" id="inputNominal" placeholder="Masukkan nominal (Rp)..." />
  <br><br>
  <button id="tombolTarik">Tarik Tunai</button>
  <button id="tombolSetor">Setor</button>
  <button id="tombolCekSaldo">Cek Saldo</button>
  <p id="infoATM"></p>

  <script>
    const tombolTarik = document.getElementById("tombolTarik")
    const tombolSetor = document.getElementById("tombolSetor")
    const tombolCekSaldo = document.getElementById("tombolCekSaldo")
    const infoATM = document.getElementById("infoATM")

    let saldo = 500000;

    tombolTarik.addEventListener("click", function(){
      inputNominal = Number(document.getElementById("inputNominal").value)
      if (saldo >= inputNominal && inputNominal > 0){
        saldo -= inputNominal
        infoATM.innerText = "Tarik tunai berhasil. Saldo: Rp " + saldo.toString()
      } else if (inputNominal <= 0 || isNaN(inputNominal)){
        infoATM.innerText = "Masukkan nominal yang valid!"
      } else {
        infoATM.innerText = "Saldo tidak cukup!"
      }

    })

    tombolSetor.addEventListener("click", function(){
        inputNominal = Number(document.getElementById("inputNominal").value)
        if (inputNominal > 0 && !isNaN(inputNominal)){
          saldo += inputNominal
          infoATM.innerText = "Setor Berhasil. Saldo: Rp " + saldo.toString()
        } else {
          infoATM.innerText = "Masukkan nominal yang valid!"
        }
    })

    tombolCekSaldo.addEventListener("click", function(){
      infoATM.innerText = "Saldo Kamu: Rp " + saldo.toString()

    })

    
    
  </script>
</body>
</html>
