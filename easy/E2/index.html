<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Soal 02 - Ganti Nama</title>
</head>

<body>

    <h2> Soal 02: Ganti Nama</h2>

    <h1 id="judul">Nama: ???</h1>
    <button id="tombolNama">Isi Nama</button>

    <script>
        const judulTeks = document.getElementById('judul');
        const tombolNama = document.getElementById('tombolNama');

        tombolNama.addEventListener('click', function() {
            judulTeks.innerText = "Nama: Jeanne";
        });
    </script>
</body>

</html>
