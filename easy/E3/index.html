<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Hitung Klik</title>
</head>
<body>

  <h2> Soal 03: Hitung Klik</h2>

  <p id="tampilKlik">Jumlah Klik: 0</p>
  <button id="tombolKlik">Klik Saya!</button>

  <script>
    const tombolKlik = document.getElementById("tombolKlik")
    const tampilKlik = document.getElementById("tampilKlik")

    let  jumlahKlik = 0

    tombolKlik.addEventListener("click", function(){
      jumlahKlik++
      tampilKlik.innerText = "Jumlah Klik: " + jumlahKlik
    })

  </script>
</body>
</html>
