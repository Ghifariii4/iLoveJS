<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 05 - Ubah Warna Teks</title>
</head>

<body>

  <h2>Soal 05: Ubah Warna Teks</h2>

  <p id="teksWarna">JavaScript itu seru!</p>
  <button id="tombolMerah">Warnai Merah</button>

  <script>
    const teks = document.getElementById("teksWarna")
    const tombolMerah  = document.getElementById("tombolMerah")

    tombolMerah.addEventListener("click", function(){
      teks.style.color = "red"
    })

  </script>
</body>

</html>
