<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 06 - Ganti Isi Paragraf</title>
</head>
<body>

  <h2>Soal 06: Ganti Isi Paragraf</h2>

  <p id="paragrafUtama">Ini adalah teks awal.</p>
  <button id="tombolGanti">Ganti Teks</button>

  <script>
    const teksUtama = document.getElementById("paragrafUtama")
    const tombolGanti = document.getElementById("tombolGanti")

    tombolGanti.addEventListener("click", function(){
      teksUtama.innertext = "Teks sudah diganti oleh Javascript!"
      
    })

  
    
  </script>
</body>
</html>
