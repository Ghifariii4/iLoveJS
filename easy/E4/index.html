<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 04 - Sembunyikan Teks</title>
</head>
<body>

  <h2> Soal 04: Sembunyikan Teks</h2>

  <p id="teksRahasia">Teks ini bisa disembunyikan!</p>
  <button id="tombolSembunyi">Sembunyikan</button>

  <script>
    const teksRahasia = document.getElementById("teksRahasia")
    const tombolPetrus = document.getElementById("tombolSembunyi") 
    
    tombolPetrus.addEventListener("click", function(){
      teksRahasia.innerText = ""
    })

  </script>
</body>
</html>
