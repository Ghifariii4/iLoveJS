<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Penghitung Mundur</title>
</head>
<body>

  <h2>Soal 03: Penghitung Mundur</h2>

  <p id="angkaHitung">10</p>
  <button id="tombolKurangi">Kurangi</button>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Simpan angka awal di variabel, lalu kurangi setiap klik

    const angkaHitung = document.getElementById("angkaHitung")
    const tombolKurangi = document.getElementById("tombolKurangi")
    let angka = 10;

    tombolKurangi.addEventListener("click", function(){
      if (angka > 0){
        angka -= 1;
        angkaHitung.innerText = angka;
      } else {
        tombolKurangi.disabled = true;
        angkaHitung.innerText = "Liftoff!";
      }
    })
  </script>
</body>
</html>
