<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Soal 02 - Validasi Input Nama</title>
  </head>

  <body>
    <h2>Soal 02: Validasi Input Nama</h2>

    <input type="text" id="inputNama" placeholder="Tulis namamu di sini..." />
    <button id="tombolCek">Cek Nama</button>
    <p id="hasilCek"></p>

    <script>
      const inputNama = document.getElementById("inputNama");
      const tombolCek = document.getElementById("tombolCek");
      const hasilCek = document.getElementById("hasilCek");

      tombolCek.addEventListener("click", function () {
        if (inputNama.value.trim() === "") {
          hasilCek.innerText = "Nama tidak boleh kosong!";
        } else {
          hasilCek.innerText = "Halo, " + inputNama.value;
        }
      });
    </script>
  </body>
</html>
