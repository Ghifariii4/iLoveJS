<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 04 - Ubah Tema Halaman</title>
</head>

<body>

  <h2>Soal 04: Ubah Tema Halaman</h2>

  <button id="tombolGelap">Mode Gelap</button>
  <button id="tombolTerang">Mode Terang</button>
  <p id="statusTema">Status tema akan muncul di sini</p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: document.body.style.backgroundColor untuk ubah background halaman

    const tombolGelap = document.getElementById("tombolGelap")
    const tombolTerang = document.getElementById("tombolTerang")
    let statusTema = document.getElementById("statusTema")

    tombolGelap.addEventListener("click", function(){
      document.body.style.backgroundColor = "black";
      statusTema.style.color = "white";
      statusTema.innerText = "Mode Gelap Aktif";
    })

    tombolTerang.addEventListener("click", function(){
      document.body.style.backgroundColor = "white";
      statusTema.style.color = "black";
      statusTema.innerText = "Mode Terang Aktif";
    })

  </script>
</body>

</html>
