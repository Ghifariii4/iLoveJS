<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 01 - Toggle Teks</title>
</head>
<body>

  <h2>Soal 01: Toggle Teks</h2>

  <p id="teksToggle">Ini teks yang bisa disembunyikan.</p>
  <button id="tombolToggle">Sembunyikan</button>

  <script>
    const teksToggle = document.getElementById("teksToggle")
    const tombolToggle = document.getElementById("tombolToggle")
    
    tombolToggle.addEventListener("click", function() {
      if (tombolToggle.innerText === "Tampilkan") {
        teksToggle.innerText = "Ini teks yang bisa disembunyikan."
        tombolToggle.innerText = "Sembunyikan"
      } else {
        teksToggle.innerText = ""
        tombolToggle.innerText = "Tampilkan"
      }
    })
    
  </script>
</body>
</html>
